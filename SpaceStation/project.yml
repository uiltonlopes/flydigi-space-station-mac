# xcodegen spec — run `xcodegen generate` in this folder to (re)create SpaceStation.xcodeproj.
# The .xcodeproj is generated and not committed; this file is the source of truth.
name: SpaceStation
options:
  bundleIdPrefix: com.uiltonlopes
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Signing: automatic with the maintainer's Personal Team (free Apple ID). Contributors: override
    # DEVELOPMENT_TEAM with your own (`xcodebuild … DEVELOPMENT_TEAM=XXXX`) or use "-" for ad-hoc.
    # SMAppService derives the helper's launch constraint from the signing team; with ad-hoc signing
    # every rebuild changes the hash and launchd kills the daemon (Launch Constraint Violation).
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: A2NY8257QF
packages:
  FlydigiKit:
    path: ../FlydigiKit
targets:
  SpaceStation:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: FlydigiKit
        product: FlydigiKit
      - package: FlydigiKit
        product: FlydigiTransport
      - package: FlydigiKit
        product: FlydigiHelperProtocol
      - sdk: GameController.framework
      - target: SpaceStationHelper
        embed: true
        codeSign: true
        copy:
          destination: executables      # → Contents/MacOS/SpaceStationHelper (what the daemon plist's BundleProgram points to)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Space Station
        CFBundleIconFile: AppIcon
        CFBundleName: Space Station
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleURLTypes:                  # spacestation://home?tab=buttons · screen · adaptive · settings · device · profile?slot=2
          - CFBundleURLName: com.uiltonlopes.spacestation
            CFBundleURLSchemes: [spacestation]
        NSHumanReadableCopyright: "MIT · Ported to macOS by Uilton Lopes\ngithub.com/uiltonlopes · linkedin.com/in/uiltonlopes\nbuymeacoffee.com/uiltonlopes · Not affiliated with Flydigi"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.uiltonlopes.spacestation.profile
            UTTypeDescription: Space Station profile
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fdgprofile]
          - UTTypeIdentifier: com.uiltonlopes.spacestation.macro
            UTTypeDescription: Space Station macro
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [fdgmacro]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Space Station profile
            LSItemContentTypes: [com.uiltonlopes.spacestation.profile]
            CFBundleTypeRole: Editor
          - CFBundleTypeName: Space Station macro
            LSItemContentTypes: [com.uiltonlopes.spacestation.macro]
            CFBundleTypeRole: Editor
    entitlements:
      path: App/SpaceStation.entitlements
      properties: {}                     # no sandbox: the app talks to the pad over HID directly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uiltonlopes.spacestation
        PRODUCT_NAME: "Space Station"
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_APP_SANDBOX: false
        INFOPLIST_KEY_LSUIElement: false
    postBuildScripts:
      - name: Embed LaunchDaemon plist
        script: |
          mkdir -p "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          cp "${SRCROOT}/Helper/com.uiltonlopes.spacestation.helper.plist" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons/"
        outputFiles:
          - "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons/com.uiltonlopes.spacestation.helper.plist"
  SpaceStationHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes: ["*.plist"]
    dependencies:
      - package: FlydigiKit
        product: FlydigiKit
      - package: FlydigiKit
        product: FlydigiTransport
      - package: FlydigiKit
        product: FlydigiHelperProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uiltonlopes.spacestation.helper
        PRODUCT_NAME: SpaceStationHelper
        ENABLE_HARDENED_RUNTIME: true
        # A launchd daemon needs an embedded Info.plist so SMAppService can identify it.
        CREATE_INFOPLIST_SECTION_IN_BINARY: true
        INFOPLIST_FILE: Helper/Info.plist
